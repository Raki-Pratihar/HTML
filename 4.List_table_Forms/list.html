<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!--Orderd List-->
    <ol>
        <li>Apple</li>
        <li>Orange</li>
        <li>Charry</li>
        <li>Mango</li>
    </ol>

    <!--Unorderd List-->
    <ul>
        <li>Apple</li>
        <li>Orange</li>
        <li>Charry</li>
        <li>Mango</li>
    </ul>
</body>
</html>
