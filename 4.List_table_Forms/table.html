<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="tableStyle.css">
</head>
<body>
    <table>
    <!--Table Head-->
    <thead>
        <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Salary</th>
        </tr>
    </thead>
    <!--Table Body-->
    <tbody>
        <tr>
            <td>Rocky</td>
            <td>Ai Eng</td>
            <td>$200k</td>
        </tr>
        <tr>
            <td>Jit</td>
            <td>Web Dev</td>
            <td>$180k</td>
        </tr>
        <tr>
            <td>Raj</td>
            <td>Data Sec</td>
            <td>$150k</td>
        </tr>
    </tbody>
    </table>
</body>
</html>
